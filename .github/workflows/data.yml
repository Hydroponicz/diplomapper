name: Refresh data

# Downloads the latest World Bank figures and commits src/data/profiles.json to the branch
# the workflow ran on, so the change can be reviewed like any other commit.
#   - Runs automatically when the data pipeline changes.
#   - Run it by hand from the Actions tab ("Run workflow") to pick up new World Bank releases.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-profiles.mjs
      - scripts/lib/profiles.mjs
      - .github/workflows/data.yml

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run data:profiles
      - name: Commit if the data changed
        run: |
          git add src/data/profiles.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh World Bank profile data ($(date -u +%F))"
          git push origin "HEAD:${GITHUB_REF_NAME}"
